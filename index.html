        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f4f6fb;
        color: #1e293b;
      }

      header {
        background: #0f172a;
        color: white;
        padding: 24px 7%;
      }

      header h1 {
        font-size: 28px;
        margin-bottom: 8px;
      }

      header p {
        color: #cbd5e1;
      }

      nav {
        display: flex;
        gap: 10px;
        padding: 18px 7%;
        background: white;
        border-bottom: 1px solid #e2e8f0;
        overflow-x: auto;
      }

      .tab {
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        background: #f1f5f9;
        color: #334155;
        font-size: 15px;
        cursor: pointer;
        white-space: nowrap;
      }

      .tab.active {
        background: #2563eb;
        color: white;
      }

      main {
        max-width: 1100px;
        margin: 30px auto;
        padding: 0 20px;
      }

      .section-heading {
        margin-bottom: 22px;
      }

      .section-heading h2 {
        margin-bottom: 8px;
      }

      .section-heading p {
        color: #64748b;
      }

      .program-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .program-card {
        background: white;
        padding: 22px;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        cursor: pointer;
        transition: 0.2s;
      }

      .program-card:hover {
        border-color: #2563eb;
        transform: translateY(-3px);
      }

      .program-card h3 {
        margin-bottom: 10px;
      }

      .program-card p {
        color: #64748b;
        font-size: 14px;
        margin-bottom: 18px;
      }

      .view-btn {
        border: none;
        background: #eff6ff;
        color: #2563eb;
        padding: 9px 14px;
        border-radius: 7px;
        cursor: pointer;
      }

      .code-panel {
        display: none;
        background: white;
        margin-top: 28px;
        padding: 22px;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
      }

      .code-panel.show {
        display: block;
      }

      .code-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }

      .copy-btn {
        padding: 10px 16px;
        border: none;
        border-radius: 7px;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }

      pre {
        background: #0f172a;
        color: #e2e8f0;
        padding: 20px;
        border-radius: 9px;
        overflow-x: auto;
        line-height: 1.6;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      code {
        font-family: Consolas, monospace;
      }

      footer {
        text-align: center;
        padding: 25px;
        color: #64748b;
      }

      @media (max-width: 600px) {
        .program-grid {
          grid-template-columns: 1fr;
        }

        header h1 {
          font-size: 24px;
        }

        .code-header {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>

      const tabs = document.querySelectorAll(".tab");
      const programGrid = document.getElementById("programGrid");
      const categoryTitle = document.getElementById("categoryTitle");
      const categoryDescription = document.getElementById(
        "categoryDescription",
      );
      const codePanel = document.getElementById("codePanel");
      const codeTitle = document.getElementById("codeTitle");
      const codeContent = document.getElementById("codeContent");
      const copyBtn = document.getElementById("copyBtn");

      let currentCategory = "cv";
      let selectedCode = "";

      function renderPrograms(category) {
        currentCategory = category;

        const isCV = category === "cv";

        categoryTitle.textContent =
          category === "cv"
            ? "Computer Vision"
            : category === "nlp"
              ? "Natural Language Processing"
              : category === "dl"
                ? "Deep Learning"
                : "Exploratory Data Analysis";

        categoryDescription.textContent =
          category === "cv"
            ? "Explore your Computer Vision programs."
            : category === "nlp"
              ? "Explore your NLP programs."
              : category === "dl"
                ? "Explore your Deep Learning programs."
                : "Explore your EDA programs.";

        programGrid.innerHTML = "";

        programs[category].forEach((program, index) => {
          const card = document.createElement("article");
          card.className = "program-card";

          const heading = document.createElement("h3");
          heading.textContent = program.title;

          const description = document.createElement("p");
          description.textContent = program.description;

          const button = document.createElement("button");
          button.className = "view-btn";
          button.textContent = "View Code";

          button.addEventListener("click", () => {
            showCode(program, index);
          });

          card.append(heading, description, button);

          card.addEventListener("click", (event) => {
            if (event.target !== button) {
              showCode(program, index);
            }
          });

          programGrid.appendChild(card);
        });

        codePanel.classList.remove("show");
        selectedCode = "";
      }

      function showCode(program, index) {
        selectedCode = program.code;

        const categoryName =
          currentCategory === "cv"
            ? "Computer Vision"
            : currentCategory === "nlp"
              ? "NLP"
              : currentCategory === "dl"
                ? "Deep Learning"
                : "EDA";

        codeTitle.textContent = `${program.title} — ${categoryName}`;

        codeContent.textContent = selectedCode;
        codePanel.classList.add("show");
        copyBtn.textContent = "Copy Code";

        codePanel.scrollIntoView({
          behavior: "smooth",
          block: "start",
        });
      }

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          tabs.forEach((item) => item.classList.remove("active"));
          tab.classList.add("active");

          renderPrograms(tab.dataset.category);
        });
      });

      copyBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(selectedCode);
          copyBtn.textContent = "Copied!";
        } catch {
          const textArea = document.createElement("textarea");
          textArea.value = selectedCode;
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand("copy");
          textArea.remove();
          copyBtn.textContent = "Copied!";
        }

        setTimeout(() => {
          copyBtn.textContent = "Copy Code";
        }, 1500);
      });

      renderPrograms("cv");
    </script>
